<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Gokul Finance</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0f766e;--brand2:#14b8a6;--good:#15803d;--bad:#b91c1c;--warn:#b45309;--chip:#eef2f6;--r:14px}
@media (prefers-color-scheme: dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--muted:#8b9bb4;--line:#22304a;--chip:#1b2740;--brand:#2dd4bf;--brand2:#14b8a6;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:14px 16px 12px}
header .row{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:820px;margin:auto}
h1{font-size:18px;margin:0}
.monthnav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px}
.monthnav button{background:none;border:0;color:#fff;font-size:18px;padding:2px 10px;cursor:pointer}
.monthnav span{min-width:104px;text-align:center;font-weight:600}
main{max-width:820px;margin:auto;padding:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:6;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button i{font-style:normal;font-size:18px}
nav.bottom button.on{color:var(--brand);font-weight:600}
.fab{position:fixed;right:18px;bottom:92px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;margin-top:4px;word-break:break-word}
.pos{color:var(--good)} .neg{color:var(--bad)}
h2{font-size:15px;margin:16px 4px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px 10px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.day{font-size:12px;color:var(--muted);margin:14px 4px 4px;font-weight:600}
.bar{height:9px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.bar>i.hot{background:var(--bad)} .bar>i.warn{background:var(--warn)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.trend{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.trend .pair{display:flex;align-items:flex-end;gap:3px;height:120px;width:100%;justify-content:center}
.trend .pair i{width:40%;max-width:18px;border-radius:5px 5px 0 0;display:block}
.trend small{font-size:11px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:120px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;margin:0}
@media(min-width:620px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.modal h3{margin:0 0 6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%}
#toast.show{opacity:1}
.cand{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.cand.dup{opacity:.55}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}
.insight{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.insight:last-child{border:0}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.eye{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;width:38px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock h2{margin:0;font-size:18px}
.dots span{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);margin:0 6px}
.dots span.on{background:var(--brand)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keys button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;cursor:pointer}
.keys span{display:block}
</style>
</head>
<body>
<header><div class="row"><h1>Gokul Finance</h1><div style="display:flex;gap:6px;align-items:center"><button class="eye" id="eye" onclick="toggleHide()" aria-label="Show or hide amounts"></button><div class="monthnav"><button onclick="shiftMonth(-1)">&lsaquo;</button><span id="mlabel"></span><button onclick="shiftMonth(1)">&rsaquo;</button></div></div></div></header>
<main id="view"></main>
<button class="fab" onclick="quickAdd()" aria-label="Add">+</button>
<nav class="bottom" id="tabs">
  <button data-t="home" onclick="go('home')"><i>&#8962;</i>Home</button>
  <button data-t="tx" onclick="go('tx')"><i>&#9776;</i>Entries</button>
  <button data-t="import" onclick="go('import')"><i>&#9993;</i>Import</button>
  <button data-t="loans" onclick="go('loans')"><i>&#9633;</i>Loans</button>
  <button data-t="invest" onclick="go('invest')"><i>&#8599;</i>Invest</button>
  <button data-t="more" onclick="go('more')"><i>&#9881;</i>More</button>
</nav>
<div id="lock"><h2>Enter PIN</h2><div class="dots" id="dots"></div>
<div class="keys">
<button onclick="lockKey('1')">1</button><button onclick="lockKey('2')">2</button><button onclick="lockKey('3')">3</button>
<button onclick="lockKey('4')">4</button><button onclick="lockKey('5')">5</button><button onclick="lockKey('6')">6</button>
<button onclick="lockKey('7')">7</button><button onclick="lockKey('8')">8</button><button onclick="lockKey('9')">9</button>
<span></span><button onclick="lockKey('0')">0</button><button onclick="lockKey('del')">&#9003;</button>
</div></div>
<div id="toast"></div>
<div id="modalHost"></div>
<script>
/* ---------- helpers ---------- */
const KEY='mlinda-finance-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const pad=n=>String(n).padStart(2,'0');
const todayISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthOf=iso=>iso.slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>ui.hideAmt?'₹••••••':'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const sum=(arr,f=x=>x)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const fmtShort=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function addMonths(m,k){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'});}
function download(name,content,type){
  /* Hosted pages block file downloads, so always show the data in a copyable box. */
  const id='exp'+Date.now();
  $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeForm()"><div class="modal"><h3>${esc(name)}</h3><p class="muted">Tap Copy, then paste into Notes, Google Drive or email and save it as a file named <b>${esc(name)}</b>.</p><textarea id="${id}" style="min-height:260px;font-family:monospace;font-size:12px" readonly>${esc(content)}</textarea><div class="actions"><button type="button" class="btn ghost" onclick="closeForm()">Close</button><button type="button" class="btn" onclick="copyExport('${id}')">Copy</button></div></div></div>`;
  const ta=document.getElementById(id); if(ta){ta.focus();ta.select();}
}
function copyExport(id){
  const ta=document.getElementById(id); if(!ta)return;
  ta.select();
  try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied');});}
  catch(e){try{document.execCommand('copy');toast('Copied');}catch(err){toast('Select the text and copy it manually');}}
}
let tTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),2300);}

/* ---------- defaults ---------- */
const DEFAULT_CATS=[
 {id:'c_salary',name:'Salary',type:'income',color:'#16a34a',budget:0},
 {id:'c_business',name:'Business Income',type:'income',color:'#0d9488',budget:0},
 {id:'c_interest',name:'Interest & Dividends',type:'income',color:'#65a30d',budget:0},
 {id:'c_other_in',name:'Other Income',type:'income',color:'#84cc16',budget:0},
 {id:'c_food',name:'Food & Dining',type:'expense',color:'#f97316',budget:8000},
 {id:'c_groc',name:'Groceries',type:'expense',color:'#eab308',budget:6000},
 {id:'c_transport',name:'Transport & Fuel',type:'expense',color:'#0ea5e9',budget:3000},
 {id:'c_shop',name:'Shopping',type:'expense',color:'#ec4899',budget:4000},
 {id:'c_bills',name:'Bills & Utilities',type:'expense',color:'#6366f1',budget:4000},
 {id:'c_rent',name:'Rent & Housing',type:'expense',color:'#8b5cf6',budget:0},
 {id:'c_health',name:'Health',type:'expense',color:'#ef4444',budget:2000},
 {id:'c_entert',name:'Entertainment',type:'expense',color:'#d946ef',budget:1500},
 {id:'c_emi',name:'Loan EMI',type:'expense',color:'#b91c1c',budget:0},
 {id:'c_invest',name:'Investments',type:'expense',color:'#0f766e',budget:0},
 {id:'c_misc',name:'Miscellaneous',type:'expense',color:'#94a3b8',budget:0}
];
const DEFAULT_RULES=[
 ['swiggy','c_food'],['zomato','c_food'],['restaurant','c_food'],['cafe','c_food'],['dominos','c_food'],['mcdonald','c_food'],
 ['bigbasket','c_groc'],['blinkit','c_groc'],['zepto','c_groc'],['dmart','c_groc'],['grocer','c_groc'],['kirana','c_groc'],
 ['uber','c_transport'],['ola','c_transport'],['rapido','c_transport'],['petrol','c_transport'],['fuel','c_transport'],['hpcl','c_transport'],['bpcl','c_transport'],['irctc','c_transport'],['metro','c_transport'],['fastag','c_transport'],
 ['amazon','c_shop'],['flipkart','c_shop'],['myntra','c_shop'],['ajio','c_shop'],['meesho','c_shop'],
 ['electric','c_bills'],['bescom','c_bills'],['airtel','c_bills'],['jio','c_bills'],['recharge','c_bills'],['broadband','c_bills'],['water bill','c_bills'],['insurance','c_bills'],
 ['rent','c_rent'],['landlord','c_rent'],
 ['hospital','c_health'],['pharmacy','c_health'],['apollo','c_health'],['medplus','c_health'],['clinic','c_health'],
 ['netflix','c_entert'],['prime video','c_entert'],['spotify','c_entert'],['bookmyshow','c_entert'],['hotstar','c_entert'],
 ['emi','c_emi'],['loan','c_emi'],
 ['zerodha','c_invest'],['groww','c_invest'],['sip','c_invest'],['mutual fund','c_invest'],['nifty','c_invest'],['ppf','c_invest'],
 ['salary','c_salary'],['payroll','c_salary'],['interest','c_interest'],['dividend','c_interest'],['refund','c_other_in'],['cashback','c_other_in']
];
const INV_TYPES=['Mutual Fund','Stocks','FD / RD','PPF / EPF','Gold','Bonds','Crypto','Real Estate','Other'];
function defaults(){
  return {
    v:2,
    categories:DEFAULT_CATS.map(c=>({...c})),
    rules:DEFAULT_RULES.map(([k,c],i)=>({id:'r'+i,keyword:k,categoryId:c})),
    transactions:[], loans:[], investments:[], seen:[],
    // Import filter: only personal accounts get imported; office signals are excluded.
    importFilter:{personalAccounts:['8207','9224','280','1526'], officeAccounts:[], officeKeywords:['office','company','corp','corporate','payroll','pvt','ltd','employer','official','business a/c']}
  };
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);return Object.assign(defaults(),d);}}catch(e){}return defaults();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Browser storage unavailable. Use Backup to keep your data.');}}

/* ---------- lookups ---------- */
const cat=id=>S.categories.find(c=>c.id===id)||{id:'',name:'Uncategorised',color:'#94a3b8',type:'expense',budget:0};
const catPairs=type=>S.categories.filter(c=>c.type===type).map(c=>[c.id,c.name]);
const catOpts=(type,sel)=>catPairs(type).map(([v,l])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
function accounts(){const set=new Set();S.transactions.forEach(t=>t.account&&set.add(t.account));S.loans.forEach(l=>l.account&&set.add(l.account));return [...set].sort();}
function fallbackCat(type,exceptId){const pref=type==='income'?'c_other_in':'c_misc';if(pref!==exceptId&&cat(pref).id)return pref;const alt=S.categories.find(c=>c.type===type&&c.id!==exceptId);return alt?alt.id:null;}

/* ---------- ledger maths ---------- */
const monthTx=m=>S.transactions.filter(t=>monthOf(t.date)===m);
function sums(list){let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount;});return {inc,exp,net:inc-exp};}
function invTotals(){const inv=sum(S.investments,i=>i.invested),cv=sum(S.investments,i=>i.currentValue);return {inv,cv,gain:cv-inv,gp:pct(cv-inv,inv)};}
function loanEmi(P,annual,n){const r=annual/1200;if(!r)return P/n;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);}
function loanMonthsLeft(out,emi,annual){const r=annual/1200;if(!emi)return 0;if(!r)return Math.ceil(out/emi);if(emi<=out*r)return Infinity;return Math.ceil(-Math.log(1-out*r/emi)/Math.log(1+r));}
function nextDue(l){const d=new Date();const day=Math.min(l.dueDay||1,28);let dt=new Date(d.getFullYear(),d.getMonth(),day);if(dt<new Date(d.getFullYear(),d.getMonth(),d.getDate()))dt=new Date(d.getFullYear(),d.getMonth()+1,day);return dt;}
function addTx(o){const t={id:uid(),date:o.date,type:o.type,amount:+o.amount,categoryId:o.categoryId,merchant:o.merchant||'',account:o.account||'',note:o.note||'',mode:o.mode||'other',source:o.source||'manual',ref:o.ref||'',raw:o.raw||'',loanId:o.loanId||'',investmentId:o.investmentId||''};S.transactions.push(t);return t;}

/* ---------- SMS parsing ---------- */
const DEBIT=/\b(debited|debit|spent|withdrawn|withdrawal|paid|payment|purchase|deducted|sent|txn of|used at)\b/i;
const CREDIT=/\b(credited|credit|received|deposited|refund)\b/i;
const OTP=/\b(otp|one[- ]time password|do not share|login code|verification code)\b/i;
const NOISE=/\b(due date|minimum due|statement|reminder|limit|offer|expires|pre-?approved|eligible|apply now)\b/i;
const AMT=/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)|([\d,]+(?:\.\d{1,2})?)\s*(?:rs\.?|inr|₹)/i;
function suggestCat(text,type){
  const low=text.toLowerCase();
  for(const r of S.rules){
    const c=cat(r.categoryId);
    if(c.id&&c.type===type&&r.keyword&&new RegExp('\\b'+escRe(r.keyword.toLowerCase())).test(low))return c.id;
  }
  return type==='income'?'c_other_in':'c_misc';
}
function parseSms(raw,fallbackDate){
  const t=raw.replace(/\s+/g,' ').trim();
  if(!t)return null;
  const m=t.match(AMT);if(!m)return null;
  const amount=parseFloat((m[1]||m[2]).replace(/,/g,''));
  if(!amount)return null;
  let type=null;
  if(DEBIT.test(t))type='expense';else if(CREDIT.test(t))type='income';
  if(!type)return null;
  const hasTxWord=/(debited|credited|spent|received|withdrawn|deposited)/i.test(t);
  if(OTP.test(t)&&!hasTxWord)return null;
  if(NOISE.test(t)&&!hasTxWord)return null;
  let date=fallbackDate;
  const dm=t.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})\b/);
  if(dm){let y=+dm[3];if(y<100)y+=2000;const mo=+dm[2],d=+dm[1];if(mo>=1&&mo<=12&&d>=1&&d<=31)date=`${y}-${pad(mo)}-${pad(d)}`;}
  const acc=t.match(/(?:a\/c|ac|acct|account|card)\s*(?:no\.?)?\s*(?:x+|\*+)?\s*(\d{3,4})\b/i);
  const bal=t.match(/(?:avl\.?\s*bal(?:ance)?|available\s*bal(?:ance)?|bal(?:ance)?)[^\d]{0,20}?([\d,]+(?:\.\d{1,2})?)/i);
  let merchant='';
  const stop='(?=\\s+(?:on|ref|upi|via|avl|bal|available|txn|dated|with|a\\/c|ending|using)\\b|[.,;]|$)';
  const pats=[/\b(?:to\s+vpa|vpa)\s+/i,/\bto\s+/i,/\bat\s+/i,/\binfo:?\s*/i,/\bfrom\s+/i,/\btowards\s+/i,/\bby\s+/i];
  for(const pt of pats){
    const re=new RegExp(pt.source+'([A-Za-z0-9@._&\\/\\- ]{3,40}?)'+stop,'i');
    const mm=t.match(re);
    if(!mm)continue;
    const cand=mm[1].trim().replace(/@.*$/,'').trim();
    if(/^(a\/c|ac\b|acct\b|account\b|card\b|xx|\d+$|upi\b)/i.test(cand)||cand.length<3)continue;
    merchant=cand;break;
  }
  return {date,type,amount,merchant:merchant||'Bank SMS',account:acc?acc[1]:'',balance:bal?parseFloat(bal[1].replace(/,/g,'')):null,raw:t};
}
const txKey=o=>[o.date,o.type,o.amount,o.account||'',o.balance??'',(o.merchant||'').toLowerCase()].join('|');
function parseBackup(text){
  if(/<sms\b/i.test(text)){
    const doc=new DOMParser().parseFromString(text,'text/xml');
    return [...doc.getElementsByTagName('sms')].filter(s=>s.getAttribute('type')!=='2').map(s=>({body:s.getAttribute('body')||'',ts:+s.getAttribute('date')||Date.now(),addr:s.getAttribute('address')||''}));
  }
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>({body:l,ts:Date.now(),addr:''}));
}
/* Personal-only filter: returns null if accepted, or a reason string if excluded */
function personalFilter(p){
  const f=S.importFilter;
  const low=p.raw.toLowerCase();
  const matches=(acc,list)=>!!acc&&list.some(x=>x&&acc.endsWith(x));
  if(matches(p.account,f.officeAccounts))return 'office account';
  if(f.officeKeywords.some(k=>k&&low.includes(k.toLowerCase())))return 'office keyword';
  if(f.personalAccounts.length){
    if(!matches(p.account,f.personalAccounts))return 'not a personal account';
  }
  return null;
}
const MODES=[['upi','UPI'],['cash','Cash'],['bank','Bank transfer (NEFT/IMPS/RTGS)'],['debit','Debit card'],['credit','Credit card'],['netbank','Net banking'],['cheque','Cheque'],['auto','Auto-debit / ECS'],['other','Other']];
const modeLabel=k=>(MODES.find(m=>m[0]===k)||['other','Other'])[1];
const modeOpts=sel=>MODES.map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
function detectMode(raw){
  const t=raw.toLowerCase();
  if(/\bupi\b|\bvpa\b|@(ybl|okaxis|oksbi|okhdfcbank|paytm|upi|icici|axl|ibl)\b/.test(t))return 'upi';
  if(/\bcredit card\b/.test(t))return 'credit';
  if(/\batm\b|\bcash\b/.test(t))return 'cash';
  if(/\bneft\b|\bimps\b|\brtgs\b/.test(t))return 'bank';
  if(/\bnet ?banking\b/.test(t))return 'netbank';
  if(/\bcheque\b|\bchq\b/.test(t))return 'cheque';
  if(/\becs\b|\bauto ?debit\b|\bach\b/.test(t))return 'auto';
  if(/\bcard\b/.test(t))return 'debit';
  return 'other';
}
function buildCandidates(items){
  const out=[];let skipped=0,office=0;
  const seenSet=new Set(S.seen);
  const refSet=new Set(S.transactions.map(t=>t.ref).filter(Boolean));
  const batch=new Set();
  for(const it of items){
    const p=parseSms(it.body,todayISO(new Date(it.ts)));
    if(!p){skipped++;continue;}
    const reason=personalFilter(p);
    if(reason){office++;continue;}
    p.categoryId=suggestCat(p.merchant+' '+p.raw,p.type);
    p.mode=detectMode(p.raw);
    p.key=txKey(p);
    p.dup=seenSet.has(p.key)||refSet.has(p.key)||batch.has(p.key);
    batch.add(p.key);
    out.push(p);
  }
  return {out,skipped,office};
}

/* ---------- generic form engine ---------- */
let FORM=null;
function openForm(o){
  FORM=o;
  const v=o.values||{};
  const accList=o.fields.some(f=>f.list==='accList')?`<datalist id="accList">${accounts().map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`:'';
  const html=o.fields.map(f=>{
    const val=v[f.k]??f.def??'';
    const req=f.req?'required':'';
    if(f.type==='checkbox'){
      const on=v[f.k]??f.def;
      return `<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="${f.k}" ${on?'checked':''} style="width:auto">${esc(f.label)}</label>`;
    }
    let input;
    if(f.type==='select')input=`<select name="${f.k}" ${req}>${f.options.map(([x,l])=>`<option value="${esc(x)}" ${String(x)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')input=`<textarea name="${f.k}">${esc(val)}</textarea>`;
    else input=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" ${f.step?`step="${f.step}"`:''} ${f.list?`list="${f.list}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} ${req} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    return `<label class="f">${esc(f.label)}</label>${input}`;
  }).join('');
  $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeForm()"><form class="modal" onsubmit="submitForm(event)"><h3>${esc(o.title)}</h3>${accList}${html}<div class="actions">${o.onDelete?'<button type="button" class="btn danger" onclick="deleteForm()">Delete</button>':''}<button type="button" class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn" type="submit">Save</button></div></form></div>`;
  if(o.setup)o.setup($('#modalHost form'));
}
function submitForm(e){
  e.preventDefault();
  const form=e.target,vals={};
  for(const f of FORM.fields){
    const el=form.elements.namedItem(f.k);
    if(f.type==='checkbox')vals[f.k]=el.checked;
    else if(f.type==='number')vals[f.k]=el.value===''?null:parseFloat(el.value);
    else vals[f.k]=el.value.trim();
  }
  for(const f of FORM.fields){
    if(f.req&&(vals[f.k]===''||vals[f.k]===null||Number.isNaN(vals[f.k]))){toast(`${f.label} is required`);return;}
  }
  if(FORM.validate){const err=FORM.validate(vals);if(err){toast(err);return;}}
  const ok=FORM.onSave(vals);
  if(ok===false)return;
  closeForm();save();render();toast('Saved');
}
function deleteForm(){
  if(!FORM||!FORM.onDelete)return;
  if(!confirm('Delete this item? This cannot be undone.'))return;
  const ok=FORM.onDelete();
  if(ok===false)return;
  closeForm();save();render();toast('Deleted');
}
function closeForm(){$('#modalHost').innerHTML='';FORM=null;}

const monthName=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString('en-IN',{month:'short'});};
const kfmt=n=>ui.hideAmt?'••':n>=100000?'₹'+(n/100000).toFixed(1)+'L':n>=1000?'₹'+Math.round(n/1000)+'k':'₹'+Math.round(n);
function monthStats(m){
  const list=monthTx(m),s=sums(list),spent={};
  list.forEach(t=>{if(t.type==='expense')spent[t.categoryId]=(spent[t.categoryId]||0)+t.amount;});
  return {list,s,spent,invest:sum(list.filter(t=>t.categoryId==='c_invest'),t=>t.amount),emi:sum(list.filter(t=>t.categoryId==='c_emi'),t=>t.amount)};
}
function reviewMonth(m){
  const cur=monthStats(m),prev=monthStats(addMonths(m,-1)),{s,spent,invest,emi}=cur;
  const good=[],tips=[];
  if(s.inc<=0)return {score:null,good,tips:['Add this month\'s income entries to get a full review.']};
  let score=100;
  const rate=s.net/s.inc*100;
  if(rate>=20)good.push(`Savings rate of ${rate.toFixed(0)}% meets the 20% goal.`);
  else{
    score-=rate>=10?10:rate>=0?20:30;
    tips.push(rate<0?`You spent ${money(-s.net)} more than you earned this month. Cut discretionary spending first.`:`Savings rate is ${rate.toFixed(0)}%. Aim for at least 20% by reducing the largest categories.`);
  }
  const emiRatio=emi/s.inc*100;
  if(emiRatio>40){score-=20;tips.push(`EMIs take ${emiRatio.toFixed(0)}% of income, above the 40% comfort limit. Avoid new loans and consider prepaying the costliest one.`);}
  else if(emiRatio>25){score-=10;tips.push(`EMIs take ${emiRatio.toFixed(0)}% of income. Keep this under 40%.`);}
  else if(emi>0)good.push(`EMIs are ${emiRatio.toFixed(0)}% of income, a comfortable level.`);
  const budgets=S.categories.filter(c=>c.type==='expense'&&c.budget>0);
  const over=budgets.filter(c=>(spent[c.id]||0)>c.budget);
  if(over.length){score-=Math.min(20,over.length*5);tips.push(`Over budget in: ${over.map(c=>c.name).join(', ')}.`);}
  else if(budgets.length)good.push('All category budgets are within limits.');
  const top=Object.entries(spent).sort((a,b)=>b[1]-a[1])[0];
  if(top&&s.exp){const share=top[1]/s.exp*100;if(share>40){score-=5;tips.push(`${cat(top[0]).name} is ${share.toFixed(0)}% of spending. It is the first place to look for savings.`);}}
  if(prev.s.exp>0){
    const ch=(s.exp-prev.s.exp)/prev.s.exp*100;
    if(ch>20){score-=10;tips.push(`Spending rose ${ch.toFixed(0)}% from last month.`);}
    else if(ch<-5)good.push(`Spending fell ${Math.abs(ch).toFixed(0)}% from last month.`);
  }
  const invRate=invest/s.inc*100;
  if(invRate>=10)good.push(`${invRate.toFixed(0)}% of income went into investments.`);
  else tips.push(`Only ${invRate.toFixed(0)}% of income was invested. A monthly SIP of 10 to 20% of income builds long-term wealth.`);
  const last3=[1,2,3].map(k=>monthStats(addMonths(m,-k)).s.exp).filter(x=>x>0);
  const avg=last3.length?sum(last3)/last3.length:s.exp;
  tips.push(`Emergency fund goal: about ${money(avg*6)} (6 months of recent average spending). Keep it in a separate savings account.`);
  return {score:Math.max(0,score),good,tips};
}
function scoreLabel(v){return v===null?'No income yet':v>=80?'Strong':v>=60?'Stable':v>=40?'Needs attention':'At risk';}
function scoreColor(v){return v===null?'var(--muted)':v>=80?'var(--good)':v>=60?'var(--brand)':v>=40?'var(--warn)':'var(--bad)';}
function donutSvg(parts,total){
  if(!total)return '<div class="empty" style="padding:20px">No expenses this month</div>';
  const r=68,c=2*Math.PI*r;let off=0;
  const arcs=parts.map(p=>{const len=p.value/total*c;const s=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"/>`;off+=len;return s;}).join('');
  return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Expense breakdown">${arcs}<text x="90" y="86" text-anchor="middle" font-size="12" fill="var(--muted)">Total spent</text><text x="90" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${money(total)}</text></svg>`;
}
function yearBarSvg(){
  const ms=[];for(let i=11;i>=0;i--)ms.push(addMonths(ui.month,-i));
  const data=ms.map(m=>sums(monthTx(m)));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const H=160,base=190;
  let g='';
  [0,0.5,1].forEach(f=>{const y=(base-H*f).toFixed(1);g+=`<line x1="40" x2="650" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="36" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="currentColor">${kfmt(max*f)}</text>`;});
  data.forEach((d,i)=>{
    const x=48+i*50,hi=d.inc/max*H,he=d.exp/max*H,hl=ms[i]===ui.month;
    g+=`<rect x="${x}" y="${(base-hi).toFixed(1)}" width="17" height="${hi.toFixed(1)}" rx="3" fill="#15803d"/>`;
    g+=`<rect x="${x+19}" y="${(base-he).toFixed(1)}" width="17" height="${he.toFixed(1)}" rx="3" fill="#b91c1c"/>`;
    g+=`<text x="${x+18}" y="${base+18}" text-anchor="middle" font-size="11" fill="currentColor" font-weight="${hl?700:400}">${monthName(ms[i])}</text>`;
    if(hl)g+=`<rect x="${x-6}" y="${base+24}" width="48" height="2" rx="1" fill="var(--brand)"/>`;
  });
  return `<svg viewBox="0 0 660 230" width="100%" style="color:var(--muted)">${g}</svg>`;
}
function modeCardHtml(m){
  const list=monthTx(m);
  const split=type=>{const bag={};list.filter(t=>t.type===type).forEach(t=>{const k=t.mode||'other';bag[k]=(bag[k]||0)+t.amount;});return bag;};
  const block=(title,bag,color)=>{

}

function txListHtml(){
  let list=S.transactions.slice();
  const q=ui.search.trim().toLowerCase();
  if(!q)list=list.filter(t=>monthOf(t.date)===ui.month);
  if(ui.fType)list=list.filter(t=>t.type===ui.fType);
  if(ui.fCat)list=list.filter(t=>t.categoryId===ui.fCat);
  if(ui.fMode)list=list.filter(t=>(t.mode||'other')===ui.fMode);
  if(q)list=list.filter(t=>[t.merchant,t.note,t.account,cat(t.categoryId).name,t.raw].join(' ').toLowerCase().includes(q));

function txForm(t){

function exportCsv(){
  const rows=[['date','type','amount','category','payment mode','payee','account','note','source']];
  S.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type,t.amount,cat(t.categoryId).name,modeLabel(t.mode),t.merchant,t.account,t.note,t.source]));

function rowType(i,type){document.getElementById('ca_'+i).innerHTML=catOpts(type,'');}
function parseFromText(text){
  if(!text||!text.trim()){toast('Nothing to parse');return;}
  const items=parseBackup(text);
  const {out,skipped,office}=buildCandidates(items);
  ui.importRows=out;ui.importSkipped=skipped;ui.importOffice=office;
  render();
  toast(`${out.length} personal entries found, ${office} office excluded`);
}
function importFile(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>parseFromText(String(r.result));
  r.readAsText(f);
}
function importSelected(){
  let n=0;
  ui.importRows.forEach((r,i)=>{
    if(!document.getElementById('sel_'+i)?.checked)return;
    const amount=parseFloat(document.getElementById('am_'+i).value);
    if(!(amount>0))return;
    addTx({
      date:document.getElementById('da_'+i).value||r.date,
      type:document.getElementById('ty_'+i).value,
      amount,
      categoryId:document.getElementById('ca_'+i).value,
      merchant:document.getElementById('me_'+i).value.trim(),
      account:document.getElementById('ac_'+i).value.trim(),
      source:'sms',mode:document.getElementById('mo_'+i).value,ref:r.key,raw:r.raw.slice(0,300)
    });
    S.seen.push(r.key);n++;
  });
  if(S.seen.length>5000)S.seen=S.seen.slice(-5000);
  ui.importRows=[];ui.paste='';
  save();render();toast(`Imported ${n} transactions`);
}

function vLoans(){
  const act=S.loans.filter(l=>l.outstanding>0.5),closed=S.loans.filter(l=>l.outstanding<=0.5);
  return `<div class="grid">
    <div class="card stat"><div class="l">Total outstanding</div><div class="v neg">${money(sum(act,l=>l.outstanding))}</div></div>
    <div class="card stat"><div class="l">Monthly EMI</div><div class="v">${money(sum(act,l=>l.emi))}</div></div>
    <div class="card stat"><div class="l">Active loans</div><div class="v">${act.length}</div></div>
  </div>
  ${act.map(loanCardHtml).join('')||'<div class="empty">No active loans. Tap + to add one.</div>'}
  ${closed.length?`<h2>Closed loans</h2><div class="card" style="padding:4px 12px">${closed.map(l=>`<div class="tx" onclick="loanForm('${l.id}')"><div class="m"><b>${esc(l.name)}</b><small>${esc(l.lender||'')} · principal ${money(l.principal)}</small></div><span class="muted">Closed</span></div>`).join('')}</div>`:''}`;
}
function loanCardHtml(l){
  const paid=l.principal?Math.max(0,(l.principal-l.outstanding)/l.principal*100):0;
  const left=loanMonthsLeft(l.outstanding,l.emi,l.rate);
  const due=nextDue(l);
  const remInt=left===Infinity?0:Math.max(0,l.emi*left-l.outstanding);
  return `<div class="card">
    <div class="row2"><div><b>${esc(l.name)}</b><div class="muted">${esc(l.lender||'')} · ${l.rate}% p.a.</div></div><div class="amt neg">${money(l.outstanding)}</div></div>
    <div class="bar"><i style="width:${paid.toFixed(1)}%"></i></div>
    <div class="muted" style="margin-top:4px">${paid.toFixed(0)}% repaid of ${money(l.principal)}</div>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><div class="l">EMI</div><div class="v">${money(l.emi)}</div></div>
      <div class="stat"><div class="l">Next due</div><div class="v">${fmtShort(due)}</div></div>
      <div class="stat"><div class="l">Months left</div><div class="v">${left===Infinity?'-':left}</div></div>
      <div class="stat"><div class="l">Interest ahead (approx.)</div><div class="v">${money(remInt)}</div></div>
    </div>
    <div class="actions"><button class="btn sm" onclick="payEmi('${l.id}')">Pay EMI</button><button class="btn sm ghost" onclick="prepayForm('${l.id}')">Prepay</button><button class="btn sm ghost" onclick="loanForm('${l.id}')">Edit</button></div>
  </div>`;
}
function payEmi(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;
  const r=l.rate/1200;
  const interest=l.outstanding*r;
  const emi=Math.min(l.emi,l.outstanding+interest);
  if(!confirm(`Record EMI of ${money(emi)} for ${l.name}?`))return;
  const princ=emi-interest;
  l.outstanding=Math.max(0,+(l.outstanding-princ).toFixed(2));
  l.paidCount=(l.paidCount||0)+1;
  addTx({date:todayISO(),type:'expense',amount:+emi.toFixed(2),categoryId:'c_emi',mode:'auto',merchant:l.lender||l.name,account:l.account||'',note:`EMI ${l.paidCount} · ${l.name}`,source:'loan',loanId:l.id});
  save();render();toast('EMI recorded');
}
function prepayForm(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;
  openForm({
    title:`Prepay · ${l.name}`,
    fields:[
      {k:'amount',label:'Prepayment amount (₹)',type:'number',req:true,min:1,step:'0.01'},
      {k:'date',label:'Date',type:'date',req:true,def:todayISO()}
    ],
    validate:v=>v.amount>l.outstanding?`Cannot exceed outstanding ${money(l.outstanding)}`:null,
    onSave:v=>{
      l.outstanding=Math.max(0,+(l.outstanding-v.amount).toFixed(2));
      addTx({date:v.date,type:'expense',amount:v.amount,categoryId:'c_emi',mode:'bank',merchant:l.lender||l.name,account:l.account||'',note:'Prepayment · '+l.name,source:'loan',loanId:l.id});
    }
  });
}
function loanForm(id){
  const l=id?S.loans.find(x=>x.id===id):null;
  openForm({

    ],

}
function ruleForm(id){
  const r=id?S.rules.find(x=>x.id===id):null;
  openForm({
    title:r?'Edit rule':'New rule',
    values:r?{...r}:{},
    fields:[
      {k:'keyword',label:'Keyword in message (e.g. swiggy)',req:true},
      {k:'categoryId',label:'Category',type:'select',options:S.categories.map(c=>[c.id,`${c.name} (${c.type})`]),req:true}
    ],
    onSave:v=>{
      const kw=v.keyword.toLowerCase();
      if(r)Object.assign(r,{keyword:kw,categoryId:v.categoryId});
      else S.rules.push({id:uid(),keyword:kw,categoryId:v.categoryId});
    },
    onDelete:r?()=>{S.rules=S.rules.filter(x=>x.id!==r.id);}:null
  });
}
function exportJson(){download(`gokul-finance-backup-${todayISO()}.json`,JSON.stringify(S,null,2),'application/json');}
function restoreFile(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(String(r.result));
      if(!Array.isArray(d.transactions)||!Array.isArray(d.categories))throw new Error('bad');
      if(!confirm('Replace ALL current data with this backup?'))return;
      S=Object.assign(defaults(),d);
      save();render();toast('Backup restored');
    }catch(e){toast('Not a valid backup file');}
  };
  r.readAsText(f);
}
function clearAll(){
  if(!confirm('Erase ALL data in this app?'))return;
  if(!confirm('Are you sure? Export a backup first if you need it.'))return;
  S=defaults();save();render();toast('All data erased');
}

/* ---------- privacy + PIN lock ---------- */
const eyeSvg=()=>ui.hideAmt?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
function toggleHide(){ui.hideAmt=!ui.hideAmt;render();}
const LOCK={entry:''};
async function sha(pin,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function renderLockDots(){const n=S.security?S.security.len:4;$('#dots').innerHTML=Array.from({length:n},(_,i)=>`<span class="${i<LOCK.entry.length?'on':''}"></span>`).join('');}
function lockNow(){if(!S.security){toast('Set a PIN first');return;}LOCK.entry='';renderLockDots();$('#lock').style.display='flex';}
async function lockKey(k){
  if(!S.security)return;
  if(k==='del')LOCK.entry=LOCK.entry.slice(0,-1);
  else if(LOCK.entry.length<S.security.len)LOCK.entry+=k;
  renderLockDots();
  if(k!=='del'&&LOCK.entry.length===S.security.len){
    let ok=false;
    try{ok=(await sha(LOCK.entry,S.security.salt))===S.security.hash;}catch(e){ok=false;}
    if(ok){$('#lock').style.display='none';LOCK.entry='';}
    else{toast('Wrong PIN');LOCK.entry='';renderLockDots();}
  }
}
async function setPin(){
  const a=$('#pin1').value,b=$('#pin2').value;
  if(!/^\d{4,6}$/.test(a)){toast('PIN must be 4 to 6 digits');return;}
  if(a!==b){toast('PINs do not match');return;}
  try{const salt=uid();const hash=await sha(a,salt);S.security={salt,hash,len:a.length};save();render();toast('PIN set');}
  catch(e){toast('PIN lock is not supported in this browser');}
}
function removePin(){if(!confirm('Remove the PIN lock?'))return;S.security=null;save();$('#lock').style.display='none';render();toast('PIN removed');}

/* ---------- boot ---------- */
render();
if(S.security)lockNow();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.security)lockNow();});
</script>
